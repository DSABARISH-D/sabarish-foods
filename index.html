<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabarish Fast Food - Mobile</title>
<style>
/* MOBILE FIRST DESIGN */
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#fff0c9;
}

.poster{
    width:100%;
    max-width:420px;
    margin:auto;
    background:white;
    min-height:100vh;
}

.header{
    background:#d35400;
    color:white;
    text-align:center;
    padding:15px;
    font-size:22px;
    font-weight:bold;
    animation:title 2s infinite;
}

@keyframes title{
    0%{letter-spacing:1px;}
    50%{letter-spacing:3px;}
    100%{letter-spacing:1px;}
}

.menu{
    padding:10px;
}

.item{
    display:flex;
    align-items:center;
    background:#fff8e5;
    margin:10px 0;
    padding:10px;
    border-radius:10px;
}

.item img{
    width:70px;
    height:60px;
    border-radius:8px;
    margin-right:10px;
}

.name{
    flex:1;
}

.price{
    font-weight:bold;
    color:#d35400;
}

.combo{
    background:#ffe0b2;
    margin:10px;
    padding:10px;
    border-radius:10px;
}

.call{
    position:fixed;
    bottom:10px;
    left:10px;
    right:10px;
}

.call button{
    width:100%;
    padding:15px;
    font-size:18px;
    background:#d35400;
    color:white;
    border:none;
    border-radius:30px;
}
</style>
</head>
<body>

<div class="poster">

<div class="header">Sabarish Fast Food</div>

<div class="menu">

<div class="item">
<img src="https://i.imgur.com/6Xegg.jpg">
<div class="name">Egg Rice</div>
<div class="price">₹60</div>
</div>

<div class="item">
<img src="https://i.imgur.com/vegfried.jpg">
<div class="name">Veg Noodles</div>
<div class="price">₹50</div>
</div>

<div class="item">
<img src="https://i.imgur.com/eggnoodle.jpg">
<div class="name">Egg Noodles</div>
<div class="price">₹60</div>
</div>

<div class="item">
<img src="https://i.imgur.com/chickenrice.jpg">
<div class="name">Chicken Rice</div>
<div class="price">₹90/110</div>
</div>

<div class="item">
<img src="https://i.imgur.com/chickenchilli.jpg">
<div class="name">Chicken Chilli 100g</div>
<div class="price">₹60</div>
</div>

</div>

<div class="combo">
<b>Combo Offers</b><br>
Chicken Rice + Chilli = ₹150<br>
Egg Rice + Chilli = ₹110
</div>

</div>

<div class="call">
<button onclick="callNow()">📞 ORDER NOW</button>
</div>

<script>
function callNow(){
 if(confirm("Call 8056074355 ?")){
   location.href="tel:8056074355";
 }
}
</script>

</body>
</html>
