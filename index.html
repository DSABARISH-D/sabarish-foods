<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabarish Fast Food</title>

<style>
/* ===== HUMAN WRITTEN SIMPLE CODE ===== */

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #fff5e6;
}

.header{
    background-color: #e67e22;
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 22px;
    font-weight: bold;
}

.container{
    width: 95%;
    max-width: 450px;
    margin: auto;
}

.box{
    background-color: white;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
}

.item{
    display: flex;
    justify-content: space-between;
    padding: 8px;
    border-bottom: 1px solid #eee;
}

.item:last-child{
    border: none;
}

.name{
    font-weight: bold;
}

.price{
    color: #c0392b;
    font-weight: bold;
}

.combo{
    background-color: #ffeaa7;
    padding: 10px;
    border-radius: 10px;
    margin-top: 10px;
}

.callbox{
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background-color: #2ecc71;
    padding: 12px;
}

.callbox button{
    width: 100%;
    padding: 14px;
    font-size: 18px;
    border: none;
    border-radius: 25px;
    background-color: #d35400;
    color: white;
}
</style>
</head>

<body>

<div class="header">
    Sabarish Fast Food
</div>

<div class="container">

    <!-- MENU SECTION -->
    <div class="box">
        <h3>Menu List</h3>

        <div class="item">
            <div class="name">Egg Rice</div>
            <div class="price">₹60</div>
        </div>

        <div class="item">
            <div class="name">Veg Noodles</div>
            <div class="price">₹50</div>
        </div>

        <div class="item">
            <div class="name">Egg Noodles</div>
            <div class="price">₹60</div>
        </div>

        <div class="item">
            <div class="name">Chicken Rice</div>
            <div class="price">₹90 / ₹110</div>
        </div>

        <div class="item">
            <div class="name">Chicken Chilli 100g</div>
            <div class="price">₹60</div>
        </div>

    </div>

    <!-- COMBO SECTION -->
    <div class="combo">
        <b>Combo Offers</b><br>
        Chicken Rice + Chilli = ₹150<br>
        Egg Rice + Chilli = ₹110
    </div>

    <!-- CONTACT -->
    <div class="box">
        <b>Contact:</b> 8056074355
    </div>

</div>

<!-- CALL BUTTON -->
<div class="callbox">
    <button onclick="callNow()">ORDER NOW</button>
</div>

<script>
// simple human readable JS
function callNow(){
    var check = confirm("Do you want to call 8056074355?");

    if(check == true){
        window.location.href = "tel:8056074355";
    }
}
</script>

</body>
</html>
